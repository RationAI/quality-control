site_name: Quality Control

nav:
  - Introduction: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quality Control Functions: getting-started/quality-control.md

  - API Reference:
      - blur_score_piqe: api/blur/blur-score-piqe.md
      - folding: api/folding/folding.md
      - residual_artifacts_and_coverage: api/residual_artifacts/residual-artifacts-and-coverage.md
      - staining:
        - dominant_stains: api/staining/dominant-stains.md
        - staining_difference: api/staining/staining-difference.md
        - is_slide_correctly_stained: api/staining/is-slide-correctly-stained.md
      - typing: api/typing.md


theme:
  name: material
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tooltips
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_if_no_docstring: true

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
